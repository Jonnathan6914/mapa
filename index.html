        <style>
        :root{
            --gv-bg:#0f172a;
            --gv-panel:#ffffff;
            --gv-panel-alt:#f4f6f8;
            --gv-border:#e2e5ea;
            --gv-text:#1f2733;
            --gv-muted:#6b7684;
            --gv-accent:#2563eb;
            --gv-accent-dark:#1d4ed8;
            --gv-good:#16a34a;
        }
        *{box-sizing:border-box;}
        html,body{
            margin:0;
            padding:0;
            height:100%;
            width:100%;
            font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
            color:var(--gv-text);
            overflow:hidden;
        }
        #app{
            display:flex;
            flex-direction:column;
            height:100vh;
            width:100vw;
        }
        #app-header{
            flex:0 0 auto;
            background:var(--gv-bg);
            color:#fff;
            padding:10px 18px;
            display:flex;
            align-items:baseline;
            gap:12px;
            flex-wrap:wrap;
            z-index:1000;
        }
        #app-header h1{
            font-size:16px;
            margin:0;
            font-weight:600;
            letter-spacing:.2px;
        }
        #app-header .gv-sub{
            font-size:11.5px;
            color:#b7c2d6;
        }
        #app-body{
            flex:1 1 auto;
            display:flex;
            min-height:0;
        }
        #mapWindow{
            flex:1 1 auto;
            position:relative;
            min-width:0;
        }
        #map{
            width:100%;
            height:100%;
        }
        #sidebar{
            flex:0 0 360px;
            width:360px;
            max-width:88vw;
            background:var(--gv-panel);
            border-left:1px solid var(--gv-border);
            display:flex;
            flex-direction:column;
            min-height:0;
            transition:margin-right .2s ease;
        }
        #sidebar.gv-collapsed{
            margin-right:-360px;
        }
        #sidebar-scroll{
            overflow-y:auto;
            flex:1 1 auto;
            padding:4px 14px 24px 14px;
        }
        #gv-toggle-btn{
            position:absolute;
            top:10px;
            right:10px;
            z-index:1001;
            background:var(--gv-bg);
            color:#fff;
            border:none;
            border-radius:8px;
            width:36px;
            height:36px;
            display:none;
            align-items:center;
            justify-content:center;
            cursor:pointer;
            font-size:15px;
        }
        .gv-section{
            border-top:1px solid var(--gv-border);
            padding:14px 0;
        }
        .gv-section:first-child{border-top:none;}
        .gv-section h2{
            font-size:13px;
            text-transform:uppercase;
            letter-spacing:.4px;
            color:var(--gv-muted);
            margin:0 0 10px 0;
            display:flex;
            align-items:center;
            gap:6px;
        }
        .gv-cards{
            display:grid;
            grid-template-columns:1fr 1fr 1fr;
            gap:8px;
        }
        .gv-card{
            background:var(--gv-panel-alt);
            border:1px solid var(--gv-border);
            border-radius:10px;
            padding:8px 6px;
            text-align:center;
        }
        .gv-card b{
            display:block;
            font-size:18px;
            color:var(--gv-accent-dark);
            line-height:1.1;
        }
        .gv-card span{
            font-size:10px;
            color:var(--gv-muted);
        }
        .gv-row{
            display:flex;
            align-items:center;
            gap:8px;
            padding:5px 2px;
            font-size:13px;
        }
        .gv-row label{
            flex:1 1 auto;
            cursor:pointer;
        }
        .gv-count{
            font-size:11px;
            color:var(--gv-muted);
            background:var(--gv-panel-alt);
            border-radius:8px;
            padding:1px 7px;
        }
        .gv-swatch{
            width:13px;
            height:13px;
            border-radius:3px;
            flex:0 0 auto;
            border:1px solid rgba(0,0,0,.25);
        }
        .gv-swatch.gv-line{
            height:4px;
            border-radius:2px;
            border:none;
        }
        .gv-legend-mini{
            display:flex;
            align-items:center;
            gap:6px;
            font-size:11.5px;
            color:var(--gv-muted);
            padding:2px 0 2px 24px;
        }
        .gv-note{
            font-size:11px;
            color:var(--gv-muted);
            margin-top:4px;
            line-height:1.35;
        }
        #gv-sector-list{
            max-height:190px;
            overflow-y:auto;
            border:1px solid var(--gv-border);
            border-radius:8px;
        }
        .gv-sector-item{
            padding:7px 10px;
            font-size:12.5px;
            cursor:pointer;
            border-bottom:1px solid var(--gv-border);
        }
        .gv-sector-item:last-child{border-bottom:none;}
        .gv-sector-item:hover{background:var(--gv-panel-alt);}
        .gv-sector-item.active{background:#eaf1ff;color:var(--gv-accent-dark);font-weight:600;}
        #gv-sector-detail{
            margin-top:8px;
            background:var(--gv-panel-alt);
            border:1px solid var(--gv-border);
            border-radius:8px;
            padding:8px 10px;
            font-size:12px;
            display:none;
        }
        #gv-sector-detail table{width:100%;border-collapse:collapse;}
        #gv-sector-detail td{padding:2px 0;}
        #gv-sector-detail td:first-child{color:var(--gv-muted);width:52%;}
        .gv-basemap-opt{
            display:flex;
            align-items:center;
            gap:8px;
            padding:5px 2px;
            font-size:13px;
        }
        #gv-filtro .slider{margin:10px 4px 6px 4px;}
        #gv-filtro .filterlabel{font-size:11.5px;color:var(--gv-muted);cursor:pointer;margin:2px 4px;}
        @media (max-width:750px){
            #sidebar{position:fixed;top:0;right:0;bottom:0;z-index:1000;box-shadow:-4px 0 14px rgba(0,0,0,.2);}
            #gv-toggle-btn{display:flex;}
        }
        </style>

        var highlightLayer;
        function highlightFeature(e) {
            highlightLayer = e.target;

            if (e.target.feature.geometry.type === 'LineString' || e.target.feature.geometry.type === 'MultiLineString') {
              highlightLayer.setStyle({
                color: 'rgba(255, 255, 255, 1.00)',
              });
            } else {

                fillOpacity: 1
              });
            }

        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }

            var popupContent = '<table>\

            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {

			layer.bindPopup(content, { maxHeight: 400 });
        }

        map.getPane('pane_parcelas_1').style['mix-blend-mode'] = 'normal';

            var popupContent = '<table>\

        // ---- helpers ----------------------------------------------------
        function gvSection(id, titleHtml) {
            var s = document.createElement('div');
            s.className = 'gv-section';
            s.id = id;
            var h = document.createElement('h2');
            h.innerHTML = titleHtml;
            s.appendChild(h);
            sidebarScroll.appendChild(s);
            return s;
        }
        function gvSumField(json, field) {
            var total = 0;
            if (!json || !json.features) return 0;
            json.features.forEach(function(f){
                var v = parseFloat(f.properties[field]);
                if (!isNaN(v)) total += v;
            });
            return total;
        }
        function gvCount(json) {
            return (json && json.features) ? json.features.length : 0;
        }
        function gvFormat(n) {
            return Math.round(n).toLocaleString('es-EC');
        }
        function gvToggleRow(container, labelText, layerVar, checked, countJson) {
            var row = document.createElement('div');
            row.className = 'gv-row';
            var cb = document.createElement('input');
            cb.type = 'checkbox';
            cb.checked = checked;
            var lab = document.createElement('label');
            lab.textContent = labelText;
            row.appendChild(cb);
            row.appendChild(lab);
            if (countJson !== undefined) {
                var badge = document.createElement('span');
                badge.className = 'gv-count';
                badge.textContent = gvCount(countJson);
                row.appendChild(badge);
            }
            cb.addEventListener('change', function() {
                if (cb.checked) { map.addLayer(layerVar); }
                else { map.removeLayer(layerVar); }
            });
            container.appendChild(row);
            return row;
        }
        function gvLegendMini(container, colorCss, label, isLine) {
            var row = document.createElement('div');
            row.className = 'gv-legend-mini';
            var sw = document.createElement('span');
            sw.className = 'gv-swatch' + (isLine ? ' gv-line' : '');
            sw.style.background = colorCss;
            row.appendChild(sw);
            var t = document.createElement('span');
            t.textContent = label;
            row.appendChild(t);
            container.appendChild(row);
        }

        // ---- 6. Tablero por sector -------------------------------------------
        (function(){
            var s = gvSection('gv-tablero', 'Tablero por sector');
            var note = document.createElement('div');
            note.className = 'gv-note';
            note.textContent = 'Datos reales por manzana. Clic para ver indicadores y ubicar en el mapa.';
            s.appendChild(note);
            var list = document.createElement('div');
            list.id = 'gv-sector-list';
            s.appendChild(list);
            var detail = document.createElement('div');
            detail.id = 'gv-sector-detail';
            s.appendChild(detail);

            function gvCollectCoords(geom, out) {
                if (!geom) return;
                if (geom.type === 'Point') { out.push(geom.coordinates); }
                else if (geom.type === 'MultiPoint' || geom.type === 'LineString') {
                    geom.coordinates.forEach(function(c){ out.push(c); });
                } else if (geom.type === 'MultiLineString' || geom.type === 'Polygon') {
                    geom.coordinates.forEach(function(ring){ ring.forEach(function(c){ out.push(c); }); });
                } else if (geom.type === 'MultiPolygon') {
                    geom.coordinates.forEach(function(poly){ poly.forEach(function(ring){ ring.forEach(function(c){ out.push(c); }); }); });
                }
            }

            (json_lotes_urbanos_2.features || []).forEach(function(feature, idx){
                var item = document.createElement('div');
                item.className = 'gv-sector-item';
                var p = feature.properties;
                item.textContent = (p['nombre'] || ('Sector ' + (idx+1))) + (p['manzana'] ? ' \u2014 Mz. ' + p['manzana'] : '');
                item.addEventListener('click', function(){
                    Array.prototype.forEach.call(list.children, function(el){ el.classList.remove('active'); });
                    item.classList.add('active');
                    detail.style.display = 'block';
                    detail.innerHTML = '<table>' +
                        '<tr><td>Uso</td><td>' + (p['uso'] != null ? p['uso'] : '\u2014') + '</td></tr>' +
                        '<tr><td>Habitantes</td><td>' + (p['n_habitantes'] != null ? Number(p['n_habitantes']).toLocaleString('es-EC') : '\u2014') + '</td></tr>' +
                        '<tr><td>\u00c1rea (m\u00b2)</td><td>' + (p['area_m2'] != null ? Number(p['area_m2']).toLocaleString('es-EC') : '\u2014') + '</td></tr>' +
                        '</table>';
                    var coords = [];
                    gvCollectCoords(feature.geometry, coords);
                    if (coords.length) {
                        var lats = coords.map(function(c){ return c[1]; });
                        var lngs = coords.map(function(c){ return c[0]; });
                        var b = [[Math.min.apply(null, lats), Math.min.apply(null, lngs)],
                                 [Math.max.apply(null, lats), Math.max.apply(null, lngs)]];
                        map.fitBounds(b, {maxZoom: 18});
                    }
                    if (!map.hasLayer(layer_lotes_urbanos_2)) { map.addLayer(layer_lotes_urbanos_2); }
                    layer_lotes_urbanos_2.eachLayer(function(lyr){
                        if (lyr.feature === feature) { lyr.openPopup(); }
                    });
                });
                list.appendChild(item);
            });
        })();

        // ---- 8. Filtro por habitantes (usa slider existente) -----------------
        (function(){
            var s = gvSection('gv-filtro', 'Filtrar manzanas por habitantes');
            var menuDiv = document.createElement('div');
            menuDiv.id = 'menu';
            s.appendChild(menuDiv);
        })();

        var Filters = {"n_habitantes": "int"};
        function filterFunc() {
          map.eachLayer(function(lyr){
          if ("options" in lyr && "dataVar" in lyr["options"]){
            features = this[lyr["options"]["dataVar"]].features.slice(0);
            try{
              for (key in Filters){
                keyS = key.replace(/[^a-zA-Z0-9_]/g, "")
                if (Filters[key] == "str" || Filters[key] == "bool"){
                  var selection = [];
                  var options = document.getElementById("sel_" + keyS).options
                  for (var i=0; i < options.length; i++) {
                    if (options[i].selected) selection.push(options[i].value);
                  }
                    try{
                      if (key in features[0].properties){
                        for (i = features.length - 1;
                          i >= 0; --i){
                          if (selection.indexOf(
                          features[i].properties[key])<0
                          && selection.length>0) {
                          features.splice(i,1);
                          }
                        }
                      }
                    } catch(err){
                  }
                }
                if (Filters[key] == "int"){
                  sliderVals =  document.getElementById(
                    "div_" + keyS).noUiSlider.get();
                  try{
                    if (key in features[0].properties){
                    for (i = features.length - 1; i >= 0; --i){
                      if (parseInt(features[i].properties[key])
                          < sliderVals[0]
                          || parseInt(features[i].properties[key])
                          > sliderVals[1]){
                            features.splice(i,1);
                          }
                        }
                      }
                    } catch(err){
                    }
                  }
                if (Filters[key] == "real"){
                  sliderVals =  document.getElementById(
                    "div_" + keyS).noUiSlider.get();
                  try{
                    if (key in features[0].properties){
                    for (i = features.length - 1; i >= 0; --i){
                      if (features[i].properties[key]
                          < sliderVals[0]
                          || features[i].properties[key]
                          > sliderVals[1]){
                            features.splice(i,1);
                          }
                        }
                      }
                    } catch(err){
                    }
                  }
                if (Filters[key] == "date"
                  || Filters[key] == "datetime"
                  || Filters[key] == "time"){
                  try{
                    if (key in features[0].properties){
                      HTMLkey = key.replace(/[&\\/\\#,+()$~%.'":*?<>{} ]/g, '');
                      startdate = document.getElementById("dat_" +
                        HTMLkey + "_date1").value.replace(" ", "T");
                      enddate = document.getElementById("dat_" +
                        HTMLkey + "_date2").value.replace(" ", "T");
                      for (i = features.length - 1; i >= 0; --i){
                        if (features[i].properties[key] < startdate
                          || features[i].properties[key] > enddate){
                          features.splice(i,1);
                        }
                      }
                    }
                  } catch(err){
                  }
                }
              }
            } catch(err){
            }
          this[lyr["options"]["layerName"]].clearLayers();
          this[lyr["options"]["layerName"]].addData(features);
        var i = 0;
        layer_equipamientos_6.eachLayer(function(layer) {
            var context = {
                feature: layer.feature,
                variables: {}

            layer.bindTooltip((layer.feature.properties['nombre'] !== null?String('<div style="color: #323232; font-size: 10pt; font-family: \'Open Sans\', sans-serif;">' + layer.feature.properties['nombre']) + '</div>':''), {permanent: true, offset: [-0, -16], className: 'css_equipamientos_6'});

            document.getElementById("menu").appendChild(

            }

        resetLabels([layer_parcelas_1,layer_equipamientos_6]);
